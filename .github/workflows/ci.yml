name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix: { goarch: [amd64, arm64] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go mod verify
      - run: GOARCH=${{ matrix.goarch }} go build -trimpath ./...
      - name: reproducible build
        run: |
          GOARCH=${{ matrix.goarch }} go build -trimpath -o /tmp/a ./cmd/freya-devca
          GOARCH=${{ matrix.goarch }} go build -trimpath -o /tmp/b ./cmd/freya-devca
          cmp /tmp/a /tmp/b
      - if: matrix.goarch == 'amd64'
        run: make tools
      - if: matrix.goarch == 'amd64'
        run: make lint
      - if: matrix.goarch == 'amd64'
        run: make vuln
      - if: matrix.goarch == 'amd64'
        run: make test
      - if: matrix.goarch == 'amd64'
        run: make cover
      - if: matrix.goarch == 'amd64'
        run: go test -run xxx -fuzz=FuzzParseSPIFFEID -fuzztime=10s ./tests/fuzz/
  contrib:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: |
          for m in contrib/audit-timescale contrib/policy-valkey; do
            if [ -f "$m/go.mod" ]; then (cd "$m" && go test -tags integration -count=1 ./...); fi
          done
  auth-service:
    runs-on: ubuntu-latest
    needs: verify
    defaults: { run: { working-directory: services/auth } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/auth/go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: services/auth/console/package-lock.json }
      - run: go mod verify
      - run: make -C ../.. tools
      - run: make lint
      - run: make vuln
      - run: make test
      - run: make cover
      - run: go test ./tests/fuzz -run xxx -fuzz FuzzAvatarDecode -fuzztime 20s
      - run: cd console && npm ci && npm run lint && npm run test:unit && npm run build && npm audit --audit-level=high
  auth-service-integration:
    runs-on: ubuntu-latest
    needs: auth-service
    defaults: { run: { working-directory: services/auth } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/auth/go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: go test -tags integration -count=1 ./tests/integration/...
      - run: docker compose -f deploy/compose.yaml up -d && cd console && npm ci && npx playwright install --with-deps chromium && npx playwright test
  gateway-service:
    runs-on: ubuntu-latest
    needs: verify
    defaults: { run: { working-directory: services/gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/gateway/go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: services/gateway/shell/package-lock.json }
      - run: go mod verify
      - run: make -C ../.. tools
      - run: make lint
      - run: make vuln
      - run: make test
      - run: make cover
      - run: cd shell && npm ci && npm run lint && npm run test:unit && npm run build && npm audit --audit-level=high
  gateway-service-integration:
    runs-on: ubuntu-latest
    needs: gateway-service
    defaults: { run: { working-directory: services/gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/gateway/go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: go test -tags integration -count=1 ./tests/integration/...
      - run: docker compose -f deploy/compose.yaml up -d && cd shell && npm ci && npx playwright install --with-deps chromium && npx playwright test
  warden-service:
    runs-on: ubuntu-latest
    needs: verify
    defaults: { run: { working-directory: services/warden } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/warden/go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: services/warden/ui/package-lock.json }
      - run: go mod verify
      - run: make -C ../.. tools
      - run: make lint
      - run: make vuln
      - run: make test
      - run: make cover
      - run: cd ui && npm ci && npm run lint && npm run test:unit && npm run build && npm audit --audit-level=high
  warden-service-integration:
    runs-on: ubuntu-latest
    needs: warden-service
    defaults: { run: { working-directory: services/warden } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/warden/go.mod }
      - run: go run ./tests/testdata/bitwarden -out tests/testdata/bitwarden
      - run: make redaction-scan   # runs the integration suite (testcontainers) and scans its capture for material
      - run: for f in FuzzFolderName FuzzSecretInput FuzzTotpSeed FuzzPathBuilder FuzzBitwarden FuzzBackup FuzzGenerator FuzzShareToken; do go test ./tests/fuzz -run xxx -fuzz "$f" -fuzztime 10s || exit 1; done
      - run: cd ui && npm ci && npx playwright install --with-deps chromium && npx playwright test   # skips without E2E_OPERATOR_PASSWORD
  notification-service:
    runs-on: ubuntu-latest
    needs: verify
    defaults: { run: { working-directory: services/notification } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/notification/go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: services/notification/ui/package-lock.json }
      - run: go mod verify
      - run: make -C ../.. tools
      - run: make lint
      - run: make vuln
      - run: make test
      - run: make cover
      - run: cd ui && npm ci && npm run gen:api && npm run lint && npm run test:unit && npm run build && npm audit --audit-level=high
  notification-service-integration:
    runs-on: ubuntu-latest
    needs: notification-service
    defaults: { run: { working-directory: services/notification } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/notification/go.mod }
      - run: make redaction-scan   # runs the integration suite (testcontainers) and scans its capture for material
      - run: for f in FuzzHeaderValue FuzzRecipient FuzzTemplate FuzzVariables FuzzSSEFrame FuzzBackup; do go test ./tests/fuzz -run xxx -fuzz "$f" -fuzztime 10s || exit 1; done
      - run: cd ui && npm ci && npm run gen:api && npx playwright install --with-deps chromium && npx playwright test   # skips without E2E_OPERATOR_PASSWORD
