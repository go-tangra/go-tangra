name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix: { goarch: [amd64, arm64] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go mod verify
      - run: GOARCH=${{ matrix.goarch }} go build -trimpath ./...
      - name: reproducible build
        run: |
          GOARCH=${{ matrix.goarch }} go build -trimpath -o /tmp/a ./cmd/freya-devca
          GOARCH=${{ matrix.goarch }} go build -trimpath -o /tmp/b ./cmd/freya-devca
          cmp /tmp/a /tmp/b
      - if: matrix.goarch == 'amd64'
        run: make tools
      - if: matrix.goarch == 'amd64'
        run: make lint
      - if: matrix.goarch == 'amd64'
        run: make vuln
      - if: matrix.goarch == 'amd64'
        run: make test
      - if: matrix.goarch == 'amd64'
        run: make cover
      - if: matrix.goarch == 'amd64'
        run: go test -run xxx -fuzz=FuzzParseSPIFFEID -fuzztime=10s ./tests/fuzz/
  contrib:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: |
          for m in contrib/audit-timescale contrib/policy-valkey; do
            if [ -f "$m/go.mod" ]; then (cd "$m" && go test -tags integration -count=1 ./...); fi
          done
  ui-kit:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - run: npm run -w ui/kit lint
      - run: npm run -w ui/kit test:coverage   # ≥80% statements; src/forms and src/api 100%
      - run: npm run -w ui/kit build
      - run: node ui/scripts/check-duplicates.mjs
      - run: node ui/scripts/check-no-legacy.mjs
      - run: node --test ui/scripts/tests/checks.spec.mjs
      - run: npm audit --audit-level=high --workspaces --include-workspace-root
      - run: npx playwright install --with-deps chromium && npx playwright test -c catalogue/playwright.config.ts
        working-directory: ui/kit
  auth-service:
    runs-on: ubuntu-latest
    needs: verify
    defaults: { run: { working-directory: services/auth } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/auth/go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: go mod verify
      - run: make -C ../.. tools
      - run: make lint
      - run: make vuln
      - run: make test
      - run: make cover
      - run: go test ./tests/fuzz -run xxx -fuzz FuzzAvatarDecode -fuzztime 20s
      - run: npm ci --prefix ../.. && npm run -w ui/kit build --prefix ../..
      - run: cd console && npm run lint && npm run test:unit && npm run build
  auth-service-integration:
    runs-on: ubuntu-latest
    needs: auth-service
    defaults: { run: { working-directory: services/auth } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/auth/go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: go test -tags integration -count=1 ./tests/integration/...
      - run: npm ci --prefix ../.. && npm run -w ui/kit build --prefix ../..
      - run: docker compose -f deploy/compose.yaml up -d && cd console && npx playwright install --with-deps chromium && npx playwright test
  gateway-service:
    runs-on: ubuntu-latest
    needs: verify
    defaults: { run: { working-directory: services/gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/gateway/go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: go mod verify
      - run: make -C ../.. tools
      - run: make lint
      - run: make vuln
      - run: make test
      - run: make cover
      - run: npm ci --prefix ../.. && npm run -w ui/kit build --prefix ../..
      - run: cd shell && npm run lint && npm run test:unit && npm run build
      # SC-007: shell + asset ≤ 75 % of the pre-migration baseline (ui/MIGRATION.md).
      - run: npm run -w services/asset/ui build --prefix ../.. && node ../../ui/scripts/check-bundle-size.mjs
  gateway-service-integration:
    runs-on: ubuntu-latest
    needs: gateway-service
    defaults: { run: { working-directory: services/gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/gateway/go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: go test -tags integration -count=1 ./tests/integration/...
      - run: npm ci --prefix ../.. && npm run -w ui/kit build --prefix ../..
      - run: docker compose -f deploy/compose.yaml up -d && cd shell && npx playwright install --with-deps chromium && npx playwright test
  warden-service:
    runs-on: ubuntu-latest
    needs: verify
    defaults: { run: { working-directory: services/warden } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/warden/go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: go mod verify
      - run: make -C ../.. tools
      - run: make lint
      - run: make vuln
      - run: make test
      - run: make cover
      - run: npm ci --prefix ../.. && npm run -w ui/kit build --prefix ../..
      - run: cd ui && npm run lint && npm run test:unit && npm run build
  warden-service-integration:
    runs-on: ubuntu-latest
    needs: warden-service
    defaults: { run: { working-directory: services/warden } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/warden/go.mod }
      - run: go run ./tests/testdata/bitwarden -out tests/testdata/bitwarden
      - run: make redaction-scan   # runs the integration suite (testcontainers) and scans its capture for material
      - run: for f in FuzzFolderName FuzzSecretInput FuzzTotpSeed FuzzPathBuilder FuzzBitwarden FuzzBackup FuzzGenerator FuzzShareToken; do go test ./tests/fuzz -run xxx -fuzz "$f" -fuzztime 10s || exit 1; done
      - run: npm ci --prefix ../.. && npm run -w ui/kit build --prefix ../..
      - run: cd ui && npx playwright install --with-deps chromium && npx playwright test   # skips without E2E_OPERATOR_PASSWORD
  notification-service:
    runs-on: ubuntu-latest
    needs: verify
    defaults: { run: { working-directory: services/notification } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/notification/go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: go mod verify
      - run: make -C ../.. tools
      - run: make lint
      - run: make vuln
      - run: make test
      - run: make cover
      - run: npm ci --prefix ../.. && npm run -w ui/kit build --prefix ../..
      - run: cd ui && npm run gen:api && npm run lint && npm run test:unit && npm run build
  notification-service-integration:
    runs-on: ubuntu-latest
    needs: notification-service
    defaults: { run: { working-directory: services/notification } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/notification/go.mod }
      - run: make redaction-scan   # runs the integration suite (testcontainers) and scans its capture for material
      - run: for f in FuzzHeaderValue FuzzRecipient FuzzTemplate FuzzVariables FuzzSSEFrame FuzzBackup; do go test ./tests/fuzz -run xxx -fuzz "$f" -fuzztime 10s || exit 1; done
      - run: npm ci --prefix ../.. && npm run -w ui/kit build --prefix ../..
      - run: cd ui && npm run gen:api && npx playwright install --with-deps chromium && npx playwright test   # skips without E2E_OPERATOR_PASSWORD
