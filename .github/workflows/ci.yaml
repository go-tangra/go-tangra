# go-tangra platform CI (v4). Generated from go-freya tools/split/templates/platform-ci.yaml.tmpl.
#
# - Go: vet + race tests for the root module (github.com/go-tangra/go-tangra/v4) and every contrib
#   module, each on its own with GOWORK=off.
# - UI kit (@go-tangra/ui, workspace ui/kit): build, lint, vitest.
# - Tags 'v*' publish @go-tangra/ui to GitHub Packages (npm.pkg.github.com). The tag must
#   equal "v" + ui/kit/package.json version. No container image is built here.
name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: 'off'

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - contrib/audit-timescale
          - contrib/policy-valkey
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

  ui-kit:
    name: UI kit build + lint + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build -w ui/kit

      - name: Lint
        run: npm run lint -w ui/kit

      - name: Unit tests (vitest)
        run: npm run test:unit -w ui/kit

  publish-ui-kit:
    name: Publish @go-tangra/ui
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - go
      - ui-kit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@go-tangra'
          cache: npm

      - name: Tag matches package version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./ui/kit/package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match ui/kit/package.json version ${have}" >&2
            exit 1
          fi

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build -w ui/kit

      - name: Publish
        run: npm publish -w ui/kit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
