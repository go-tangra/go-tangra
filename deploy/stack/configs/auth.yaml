service_name: auth
trust_domain: example.org
env: dev
identity:
  provider: file
  file: { cert: /certs/auth.pem, key: /certs/auth.key, bundle: /certs/ca.pem }
authz: { source: file, path: deploy/policy.yaml }
server: { grpc_addr: 0.0.0.0:9543, http_addr: 0.0.0.0:9544 }
admin: { addr: 127.0.0.1:9190 }
discovery:
  static:
    gateway: ["gateway:9643"]
gateway: { enabled: true, service: gateway }
issuer: https://localhost:8443
db:
  dsn: postgres://auth_app:dev@timescaledb:5432/auth?sslmode=disable
  migrate_dsn: postgres://postgres:dev@timescaledb:5432/auth?sslmode=disable
valkey: { addresses: ["valkey:6379"], username: auth, password: dev, allow_plaintext: true }
openfga: { url: http://openfga:8080, preshared_key: dev-openfga-key, allow_plaintext: true }
kek: { source: file, path: deploy/dev-kek.b64 }
email: { transport: smtp, host: mailpit, port: 1025, from: auth@example.org, allow_plaintext: true }
profile: { avatar_max_bytes: 2097152, avatar_size: 512 }
limits: { max_request_bytes: 2162688 }
