# Split manifest: one entry per go-freya service -> its go-tangra v4 repository.
#
# Consumed by tools/split/cmd/render (Dockerfile / CI / .dockerignore rendering,
# spec-dir lookup for extract.sh). Facts were read from services/<x>/Dockerfile,
# services/<x>/cmd, specs/ and `gh repo view go-tangra/<repo> --json defaultBranchRef`
# on 2026-09-24.
#
# Field reference
#   dir            monorepo directory that becomes the repo root
#   repo           target GitHub repository (owner/name); image = ghcr.io/<repo>
#   new_repo       true when the repository does not exist yet (must be created, with confirmation)
#   default_branch default branch of the target repo (CI push/PR trigger)
#   level          migration level (plan: L0 platform .. L5); lower levels are published first
#   module         Go module path of the service (repo root)
#   sdk            nested Go module at sdk/ (tagged sdk/vX.Y.Z by hand)
#   specs          spec directories carried into the repo history (specs/NNN-*)
#   ui             front-end dir (ui | console | shell | none), its npm build scripts and dist dirs
#   binaries       go build outputs: name, cmd package, build tags (today's tags kept)
#   version_var    main.version exists in the service's main package (ldflags -X target)
#   buf            buf.yaml at the service root (CI buf lint job)
#   runtime        alpine:3.20 runtime: apk packages, setcap lines, EXPOSE ports, entrypoint/cmd.
#                  User is always app (uid 10001); deploy/ is always copied to /app/deploy.
#
# EXPOSE: no service image declares EXPOSE today (ports are wired by deploy/stack),
# so expose lists are empty to keep the runtime identical.

platform:
  repo: go-tangra/go-tangra
  new_repo: true
  default_branch: main
  level: L0
  module: github.com/go-tangra/go-tangra/v4
  contrib:
    - contrib/audit-timescale
    - contrib/policy-valkey
  specs:
    - specs/001-secure-service-channel
    - specs/013-flyonui-frontend-rework
  npm_package: "@go-tangra/ui"
  npm_workspace: ui/kit

services:
  - name: auth
    dir: services/auth
    repo: go-tangra/go-tangra-auth
    new_repo: true
    default_branch: main
    level: L2
    module: github.com/go-tangra/go-tangra-auth/v4
    sdk: true
    specs:
      - specs/002-tenant-auth-service
      - specs/004-groups-user-profiles
      - specs/016-auth-ldap-import
    ui:
      dir: console
      build_scripts: [build, "build:remote"]
      dist: [dist, dist-remote]
    binaries:
      - { name: authsvc, cmd: ./cmd/authsvc, tags: "console remote" }
    version_var: false
    buf: true
    runtime:
      apk: [ca-certificates, postgresql-client]
      setcap: []
      expose: []
      entrypoint: [authsvc]
      cmd: ["-config", "deploy/dev.yaml"]

  - name: gateway
    dir: services/gateway
    repo: go-tangra/go-tangra-portal
    new_repo: false
    default_branch: main
    level: L2
    module: github.com/go-tangra/go-tangra-portal/v4
    sdk: true
    specs:
      - specs/003-application-gateway
    ui:
      dir: shell
      build_scripts: [build]
      dist: [dist]
    binaries:
      - { name: gatewaysvc, cmd: ./cmd/gatewaysvc, tags: "shell" }
    version_var: false
    buf: false
    runtime:
      apk: [ca-certificates, postgresql-client]
      setcap: []
      expose: []
      entrypoint: [gatewaysvc]
      cmd: ["-config", "deploy/dev.yaml"]

  - name: lcm
    dir: services/lcm
    repo: go-tangra/go-tangra-lcm
    new_repo: false
    default_branch: main
    level: L2
    module: github.com/go-tangra/go-tangra-lcm/v4
    sdk: true
    specs:
      - specs/007-lcm-service
    ui:
      dir: ui
      build_scripts: [build]
      dist: [dist]
    binaries:
      - { name: lcmsvc, cmd: ./cmd/lcmsvc, tags: "ui" }
      - { name: lcm-devca, cmd: ./cmd/lcm-devca, tags: "" }
    version_var: false
    buf: false
    runtime:
      apk: [ca-certificates, postgresql-client]
      setcap: []
      expose: []
      entrypoint: [lcmsvc]
      cmd: ["-config", "deploy/dev.yaml"]

  - name: warden
    dir: services/warden
    repo: go-tangra/go-tangra-warden
    new_repo: false
    default_branch: main
    level: L3
    module: github.com/go-tangra/go-tangra-warden/v4
    sdk: true
    specs:
      - specs/005-warden-secrets
    ui:
      dir: ui
      build_scripts: [build]
      dist: [dist]
    binaries:
      - { name: wardensvc, cmd: ./cmd/wardensvc, tags: "ui" }
    version_var: false
    buf: false
    runtime:
      apk: [ca-certificates, postgresql-client]
      setcap: []
      expose: []
      entrypoint: [wardensvc]
      cmd: ["-config", "deploy/dev.yaml"]

  - name: inventory
    dir: services/inventory
    repo: go-tangra/go-tangra-inventory
    new_repo: false
    default_branch: main
    level: L3
    module: github.com/go-tangra/go-tangra-inventory/v4
    sdk: true
    specs:
      - specs/010-inventory-service
    ui:
      dir: ui
      build_scripts: [build]
      dist: [dist]
    binaries:
      - { name: inventorysvc, cmd: ./cmd/inventorysvc, tags: "ui" }
    # inventorysvc has no main.version; cmd/inventory-agent does (not built into the image).
    version_var: false
    buf: false
    runtime:
      apk: [ca-certificates, postgresql-client]
      setcap: []
      expose: []
      entrypoint: [inventorysvc]
      cmd: ["-config", "deploy/container.yaml"]

  - name: notification
    dir: services/notification
    repo: go-tangra/go-tangra-notification
    new_repo: false
    default_branch: master
    level: L3
    module: github.com/go-tangra/go-tangra-notification/v4
    sdk: false
