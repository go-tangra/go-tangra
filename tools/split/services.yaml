    ui:
      dir: ui
      build_scripts: [build]
      dist: [dist]
    binaries:
      - { name: deployersvc, cmd: ./cmd/deployersvc, tags: "ui" }
    version_var: false
    buf: true
    runtime:
      apk: [ca-certificates, postgresql-client]
      setcap: []
      expose: []
      entrypoint: [deployersvc]
      cmd: ["-config", "deploy/container.yaml"]

  - name: ipam
    dir: services/ipam
    repo: go-tangra/go-tangra-ipam
    new_repo: false
    default_branch: main
    level: L4
    module: github.com/go-tangra/go-tangra-ipam/v4
    sdk: true
    specs:
      - specs/011-ipam-service
    ui:
      dir: ui
      build_scripts: [build]
      dist: [dist]
