      - { name: ipamsvc, cmd: ./cmd/ipamsvc, tags: "ui" }
    version_var: false
    buf: false
    runtime:
      apk: [ca-certificates, postgresql-client, libcap]
      # CAP_NET_RAW lets the unprivileged app user send ICMP echo for discovery scans.
      setcap: ["cap_net_raw+ep /usr/local/bin/ipamsvc"]
      expose: []
      entrypoint: [ipamsvc]
      cmd: ["-config", "deploy/container.yaml"]

  - name: ticket
